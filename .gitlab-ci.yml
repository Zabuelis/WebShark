stages:
  - build
  - test
  - deploy

variables:
  COMPOSE_CMD: "docker compose --env-file src/WebShark/.env"
  ENV_FILE: "src/WebShark/.env"

before_script:
  - cp src/WebShark/.env.example $ENV_FILE

build_images:
  stage: build
  script:
    - echo "Building Docker images..."
    - $COMPOSE_CMD build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

run_tests:
  stage: test
  script:
    - $COMPOSE_CMD up -d
    - docker exec webshark-app composer install --no-interaction --prefer-dist
    - $COMPOSE_CMD run --rm node npm install --legacy-peer-deps
    - docker exec webshark-app php artisan key:generate
    - docker exec webshark-app php artisan migrate --force
    - docker exec webshark-app php artisan test
  after_script:
    - docker compose --env-file src/WebShark/.env down
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

deploy_to_production:
  stage: deploy
  environment: production
  script:
    - echo "Patching .env for production with port 9401..."
    - cp src/WebShark/.env.example $ENV_FILE
    
    - sed -i "s|^APP_URL=.*|APP_URL=http://193.219.91.104:9401|g" $ENV_FILE
    - sed -i "s|^VITE_APPLICATION_BASE_URL=.*|VITE_APPLICATION_BASE_URL=http://193.219.91.104:9401|g" $ENV_FILE
    
    - echo "Deploying WebShark..."
    - $COMPOSE_CMD up -d --build
    
    - echo "Building frontend assets..."
    - $COMPOSE_CMD run --rm node npm install --legacy-peer-deps
    - $COMPOSE_CMD run --rm node npm run build
    
    - docker exec webshark-app composer install --no-interaction --optimize-autoloader --no-dev
    - docker exec webshark-app php artisan key:generate --force
    - docker exec webshark-app php artisan storage:link || echo "Already linked"
    - docker exec webshark-app php artisan migrate --force
    - docker exec webshark-app php artisan config:cache
    - docker exec webshark-app php artisan route:cache
    - docker exec webshark-app php artisan view:cache

    - docker stop webshark-node || true
    
    - echo "Application is LIVE at http://193.219.91.104:9401"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"