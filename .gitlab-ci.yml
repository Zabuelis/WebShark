stages:
  - build
  - test
  - deploy

variables:
  VM_IP: "193.219.91.104"
  VM_PORT: "9401"
  APP_URL: "http://${VM_IP}:${VM_PORT}"
  COMPOSE_CMD: "docker compose --env-file src/WebShark/.env"
  ENV_FILE: "src/WebShark/.env"

.env-setup: &env-setup
  - cp src/WebShark/.env.example $ENV_FILE
  - sed -i "s/WWWUSER=1000/WWWUSER=$(id -u)/" $ENV_FILE
  - sed -i "s/WWWGROUP=1000/WWWGROUP=$(id -g)/" $ENV_FILE
  - sed -i "s|^APP_URL=.*|APP_URL=${APP_URL}|g" $ENV_FILE
  - sed -i "s|^VITE_APPLICATION_BASE_URL=.*|VITE_APPLICATION_BASE_URL=${APP_URL}|g" $ENV_FILE
  - sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|g" $ENV_FILE

build_images:
  stage: build
  before_script:
    - *env-setup
  script:
    - echo "Building Docker images..."
    - $COMPOSE_CMD build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

run_tests:
  stage: test
  variables:
    CI_PROJECT_NAME: "webshark-ci-${CI_PIPELINE_ID}"
    CI_ENV_FILE: "src/WebShark/.env.ci-${CI_PIPELINE_ID}"
    CI_COMPOSE_CMD: "docker compose --env-file src/WebShark/.env.ci-${CI_PIPELINE_ID} -p webshark-ci-${CI_PIPELINE_ID}"
    CI_APP_CONTAINER: "webshark-ci-${CI_PIPELINE_ID}-app"
  before_script:
    - cp src/WebShark/.env.example $CI_ENV_FILE
    - sed -i "s/WWWUSER=1000/WWWUSER=$(id -u)/" $CI_ENV_FILE
    - sed -i "s/WWWGROUP=1000/WWWGROUP=$(id -g)/" $CI_ENV_FILE
    - sed -i "s|^APP_URL=.*|APP_URL=${APP_URL}|g" $CI_ENV_FILE
    - sed -i "s|^VITE_APPLICATION_BASE_URL=.*|VITE_APPLICATION_BASE_URL=${APP_URL}|g" $CI_ENV_FILE
    - sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|g" $CI_ENV_FILE
  script:
    - $CI_COMPOSE_CMD up -d --build
    - sleep 10
    - docker exec $CI_APP_CONTAINER chmod -R 775 storage bootstrap/cache
    - docker exec $CI_APP_CONTAINER composer install --no-interaction --prefer-dist
    - $CI_COMPOSE_CMD run --rm node npm install
    - docker exec $CI_APP_CONTAINER php artisan key:generate
    - docker exec $CI_APP_CONTAINER php artisan migrate --force
    - docker exec $CI_APP_CONTAINER php artisan test
  after_script:
    - docker compose --env-file src/WebShark/.env.ci-${CI_PIPELINE_ID} -p webshark-ci-${CI_PIPELINE_ID} down -v
    - rm -f src/WebShark/.env.ci-${CI_PIPELINE_ID}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

deploy_to_production:
  stage: deploy
  environment:
    name: production
    url: $APP_URL
  before_script:
    - *env-setup
  script:
    - echo "Deploying WebShark to ${APP_URL}..."
    - $COMPOSE_CMD down --remove-orphans

    - $COMPOSE_CMD up -d --build
    - sleep 5

    - docker exec webshark-app composer install --no-interaction --optimize-autoloader --no-dev
    - docker exec webshark-app chmod -R 775 storage bootstrap/cache
    - docker exec webshark-app php artisan storage:link || echo "Already linked"
    - docker exec webshark-app php artisan migrate --force

    - $COMPOSE_CMD run --rm node npm install
    - $COMPOSE_CMD run --rm node npm run build

    - docker exec webshark-app php artisan config:cache
    - docker exec webshark-app php artisan route:cache
    - docker exec webshark-app php artisan view:cache

    - echo "Application is LIVE at ${APP_URL}"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
